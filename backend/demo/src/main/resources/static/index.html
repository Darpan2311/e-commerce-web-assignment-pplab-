<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce Store</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
            --hover-border: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }
        header p {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .search-bar {
            margin-bottom: 40px;
            text-align: center;
        }
        .search-bar input {
            width: 50%;
            padding: 12px 16px;
            font-size: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 0;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus {
            border-color: var(--hover-border);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }
        .product-card:hover {
            border-color: var(--hover-border);
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s;
        }
        .product-card:hover img {
            filter: grayscale(0%);
        }
        .product-info {
            padding: 20px;
        }
        .product-info h3 {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .product-info p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .price {
            font-weight: 600;
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .btn {
            display: block;
            text-align: center;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0 20px 20px 20px;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to Our Store</h1>
    <p>Browse our collection of quality products</p>
</header>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="fetchProducts()">
    </div>

    <div id="productGrid" class="product-grid">
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/products';

    async function fetchProducts() {
        const searchQuery = document.getElementById('searchInput').value;
        let url = API_URL;
        if (searchQuery) {
            url += `?search=${encodeURIComponent(searchQuery)}`;
        }

        try {
            const response = await fetch(url);
            const products = await response.json();

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No products found.</p>';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                        <img src="${product.imageUrl || 'https://via.placeholder.com/250'}" alt="${product.name}">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p>${product.description.substring(0, 80)}...</p>
                            <div class="price">$${product.price.toFixed(2)}</div>
                        </div>
                        <a href="product.html?id=${product.id}" class="btn">View Details</a>
                    `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error('Error fetching products:', error);
            document.getElementById('productGrid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">Could not connect to backend server.</p>';
        }
    }

    fetchProducts();
</script>
</body>
</html>
